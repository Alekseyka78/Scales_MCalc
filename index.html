<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Шкалы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>html,body{margin:0;height:100%;background:#fff;color:#000;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
#msg{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:16px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;margin-top:12px}</style>
</head>
<body>
<div id="msg">Загрузка…</div>

<script>
/* ===== ПОСТОЯННЫЙ index.html — при обновлении калькуляторов НЕ менять =====
   Файл шкал в репозитории всегда называется scales-mcalc.html. */
var CALC_FILE = 'scales-mcalc.html';

/* Счётчик пользователей: отправляет данные Telegram на воркер Cloudflare. */
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) { console.warn('Telegram WebApp data is unavailable'); return; }
  tg.ready();
  fetch('https://mcalc-statistics.alekseyka.workers.dev/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData: tg.initData })
  })
  .then(function (r) { return r.json(); })
  .then(function (d) { console.log('Статистика:', d); })
  .catch(function (e) { console.error('Ошибка счётчика:', e); });
})();

/* Загрузка файла калькуляторов вместо этой страницы */
function loadCalc() {
  var box = document.getElementById('msg');
  box.textContent = 'Загрузка…';
  fetch(encodeURIComponent(CALC_FILE), { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () {
      box.innerHTML = 'Не удалось загрузить шкалы.<br><button onclick="loadCalc()">Повторить</button>';
    });
}
loadCalc();
</script>
</body>
</html>
